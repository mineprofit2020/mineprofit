services:
  - type: web
    name: mineprofit-network
    env: node
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: NODE_VERSION
        value: 20.0.0
      - key: DATABASE_URL
        fromDatabase:
          name: mineprofit-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
