<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Crypto Slots (Preview) - MineProfit</title>
  <link rel="icon" type="image/svg+xml" href="/img/favicon.svg">
  <link rel="stylesheet" href="/css/style.css">
  <style>
    .preview-banner{margin:16px 0;padding:12px;border:1px dashed var(--gold);border-radius:10px;color:var(--gold)}
    .slots-container {
      background: #1a1a1a;
      border: 4px solid #333;
      border-radius: 20px;
      padding: 30px;
      position: relative;
      box-shadow: 0 0 30px rgba(0,0,0,0.5), inset 0 0 20px rgba(244,196,48,0.1);
      margin: 20px 0;
    }
    .slots-container::before {
      content: 'MINE SLOTS';
      position: absolute;
      top: -15px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--gold);
      color: #000;
      padding: 2px 20px;
      border-radius: 10px;
      font-weight: bold;
      font-size: 0.8rem;
    }
    .slots-wrap{display:flex;gap:15px;justify-content:center;margin:20px 0}
    .slot {
      width: 100px;
      height: 100px;
      display: flex;
      align-items: center;
      justify-content:center;
      border: 3px solid #444;
      border-radius: 15px;
      background: linear-gradient(145deg, #222, #111);
      font-size: 3rem;
      transition: all 0.1s;
      box-shadow: inset 0 0 15px rgba(0,0,0,0.8);
    }
    .slot.spinning {
      animation: slot-spin 0.1s linear infinite;
      filter: blur(2px);
    }
    @keyframes slot-spin {
      0% { transform: translateY(-5px); }
      50% { transform: translateY(5px); }
      100% { transform: translateY(-5px); }
    }
    .slot.winner {
      border-color: var(--gold);
      box-shadow: 0 0 20px var(--gold-dim);
      animation: winner-pulse 0.5s ease-in-out infinite;
    }
    @keyframes winner-pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.1); }
    }
    .controls{display:flex;gap:12px;justify-content:center;margin-top:20px;}
    .rules-card {
      margin-top: 20px;
      background: rgba(255,255,255,0.03);
      padding: 15px;
      border-radius: 10px;
      font-size: 0.85rem;
    }
    .rules-card h4 { color: var(--gold); margin-bottom: 8px; }
    .rules-card ul { padding-left: 20px; color: var(--text-secondary); }
  </style>
  </head>
<body>
  <nav class="navbar">
    <div class="nav-brand">⛏️ MineProfit</div>
    <div class="nav-links">
      <a href="/games.html">🎮 Games</a>
      <a href="/dashboard.html">Dashboard</a>
    </div>
  </nav>
  <div class="container">
    <h1 class="section-title">🎰 Crypto Slots</h1>
    <div style="max-width:560px;margin:0 auto;">
      <div class="stats-grid" style="grid-template-columns:1fr;">
        <div class="stat-card balance-card">
          <div class="stat-icon">💰</div>
          <div class="stat-info">
            <div class="stat-label">Your Balance</div>
            <div class="stat-value" id="cs_balance">₹0.00</div>
          </div>
        </div>
      </div>

      <div class="slots-container">
        <div class="form-grid" style="margin-bottom:20px;">
          <div class="form-group">
            <label>Enter Bet Amount (₹)</label>
            <input type="number" id="cs_bet" value="10" min="10" step="10" class="input-admin" style="text-align:center;font-size:1.2rem;padding:12px;">
          </div>
        </div>

        <div class="slots-wrap">
          <div class="slot" id="s1">💎</div>
          <div class="slot" id="s2">⚡</div>
          <div class="slot" id="s3">⛏️</div>
        </div>

        <div id="cs_msg" class="success-msg" style="display:none;text-align:center;margin:15px 0;padding:10px;border-radius:8px;"></div>
        
        <div class="controls">
          <button class="btn btn-primary" id="spinBtn" onclick="csSpin()" style="padding:15px 40px;font-size:1.1rem;text-transform:uppercase;letter-spacing:1px;">🎰 Spin Now</button>
        </div>
      </div>

      <div class="rules-card">
        <h4>📜 Game Rules & Payouts</h4>
        <ul>
          <li>Minimum bet is <strong>₹10</strong>.</li>
          <li>Match any 3 symbols to win <strong>10x</strong> your bet!</li>
          <li>Match 3 💎 (Diamonds) for a <strong>50x MEGA WIN</strong>!</li>
          <li>Match 3 ⛏️ (Pickaxes) to win a <strong>FREE Mini Miner</strong> machine!</li>
        </ul>
      </div>

      <div style="text-align:center;margin-top:20px;">
        <a href="/games.html" class="btn btn-buy" style="width:auto;">⬅️ Back to Games</a>
      </div>
    </div>
  </div>
  <script src="/js/game-slots.js"></script>
</body>
</html>
