<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - MineProfit</title>
  <link rel="icon" type="image/svg+xml" href="/img/favicon.svg">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body class="auth-page">
  <div class="auth-container">
    <div class="auth-card">
      <div class="auth-header">
        <div class="logo">⛏️ MineProfit</div>
        <p class="subtitle">Start Mining. Start Earning.</p>
      </div>

      <form id="loginForm">
        <div class="form-group">
          <label for="identifier">Username or Email</label>
          <input type="text" id="identifier" name="identifier" placeholder="Enter your username or email" required autocomplete="username">
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" placeholder="Enter your password" required>
        </div>

        <div id="errorMsg" class="error-msg" style="display:none;"></div>

        <button type="submit" class="btn btn-primary btn-full">Login</button>
      </form>

      <div class="auth-footer">
        <p>Don't have an account? <a href="/register.html">Register here</a></p>
      </div>
    </div>
  </div>

  <script src="/js/auth.js"></script>
</body>
</html>
