<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dice Royale (Preview) - MineProfit</title>
  <link rel="icon" type="image/svg+xml" href="/img/favicon.svg">
  <link rel="stylesheet" href="/css/style.css">
  <style>
    .preview-banner{margin:16px 0;padding:12px;border:1px dashed var(--gold);border-radius:10px;color:var(--gold)}
    .dice-container {
      background: #1a1a1a;
      border: 4px solid #333;
      border-radius: 20px;
      padding: 30px;
      position: relative;
      box-shadow: 0 0 30px rgba(0,0,0,0.5);
      margin: 20px 0;
      text-align: center;
    }
    
    /* Realistic CSS Dice */
    .dice-face {
      display: grid;
      grid-template-areas: "a . b" "c d e" "f . g";
      grid-template-columns: repeat(3, 1fr);
      grid-template-rows: repeat(3, 1fr);
      background: #eee;
      width: 40px;
      height: 40px;
      padding: 5px;
      border-radius: 8px;
      box-shadow: inset 0 0 5px #ccc, 0 2px 4px rgba(0,0,0,0.3);
      margin: 0 auto;
    }
    .dice-face.large {
      width: 100px;
      height: 100px;
      padding: 10px;
      border-radius: 18px;
      box-shadow: inset 0 0 10px #ccc, 0 6px 12px rgba(0,0,0,0.5);
      filter: drop-shadow(0 0 12px rgba(244,196,48,0.3));
    }
    .dot {
      width: 6px;
      height: 6px;
      background: #222;
      border-radius: 50%;
      align-self: center;
      justify-self: center;
      visibility: hidden;
    }
    .dice-face.large .dot { width: 16px; height: 16px; }
    
    .side-1 .dot:nth-child(5) { visibility: visible; grid-area: d; }
    .side-1.large .dot:nth-child(5) { background: #e11d48; } /* Red dot for 1 */

    .side-2 .dot:nth-child(3) { visibility: visible; grid-area: b; }
    .side-2 .dot:nth-child(7) { visibility: visible; grid-area: f; }

    .side-3 .dot:nth-child(3) { visibility: visible; grid-area: b; }
    .side-3 .dot:nth-child(5) { visibility: visible; grid-area: d; }
    .side-3 .dot:nth-child(7) { visibility: visible; grid-area: f; }

    .side-4 .dot:nth-child(1) { visibility: visible; grid-area: a; }
    .side-4 .dot:nth-child(3) { visibility: visible; grid-area: b; }
    .side-4 .dot:nth-child(7) { visibility: visible; grid-area: f; }
    .side-4 .dot:nth-child(9) { visibility: visible; grid-area: g; }

    .side-5 .dot:nth-child(1) { visibility: visible; grid-area: a; }
    .side-5 .dot:nth-child(3) { visibility: visible; grid-area: b; }
    .side-5 .dot:nth-child(5) { visibility: visible; grid-area: d; }
    .side-5 .dot:nth-child(7) { visibility: visible; grid-area: f; }
    .side-5 .dot:nth-child(9) { visibility: visible; grid-area: g; }

    .side-6 .dot:nth-child(1) { visibility: visible; grid-area: a; }
    .side-6 .dot:nth-child(3) { visibility: visible; grid-area: b; }
    .side-6 .dot:nth-child(4) { visibility: visible; grid-area: c; }
    .side-6 .dot:nth-child(6) { visibility: visible; grid-area: e; }
    .side-6 .dot:nth-child(7) { visibility: visible; grid-area: f; }
    .side-6 .dot:nth-child(9) { visibility: visible; grid-area: g; }

    .dice {
      margin: 40px 0;
      display: inline-block;
      transition: all 0.2s;
    }

    .dice.rolling {
      animation: dice-roll 0.2s linear infinite;
    }
    @keyframes dice-roll {
      0% { transform: rotate(0deg) scale(0.9); }
      25% { transform: rotate(90deg) scale(1.1); }
      50% { transform: rotate(180deg) scale(0.9); }
      75% { transform: rotate(270deg) scale(1.1); }
      100% { transform: rotate(360deg) scale(0.9); }
    }
    .dice-picks {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 15px;
      margin: 20px 0;
    }
    .dice-btn {
      background: #222;
      border: 2px solid #444;
      border-radius: 15px;
      padding: 15px;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .dice-btn:hover { border-color: var(--gold); background: #2a2a2a; }
    .dice-btn.selected {
      background: rgba(244,196,48,0.1);
      border-color: var(--gold);
      transform: scale(1.05);
      box-shadow: 0 0 15px var(--gold-dim);
    }
    .dice-btn.selected .dice-face {
      background: var(--gold);
      box-shadow: inset 0 0 5px rgba(255,255,255,0.5);
    }
    .dice-btn.selected .dot { background: #000; }
    .rules-card {
      margin-top: 20px;
      background: rgba(255,255,255,0.03);
      padding: 15px;
      border-radius: 10px;
      font-size: 0.85rem;
      text-align: left;
    }
    .rules-card h4 { color: var(--gold); margin-bottom: 8px; }
    .rules-card ul { padding-left: 20px; color: var(--text-secondary); }
  </style>
</head>
<body>
  <nav class="navbar">
    <div class="nav-brand">⛏️ MineProfit</div>
    <div class="nav-links">
      <a href="/games.html">🎮 Games</a>
      <a href="/dashboard.html">Dashboard</a>
    </div>
  </nav>
  <div class="container">
    <h1 class="section-title">🎲 Dice Royale</h1>
    <div style="max-width:520px;margin:0 auto;">
      <div class="stats-grid" style="grid-template-columns:1fr;">
        <div class="stat-card balance-card">
          <div class="stat-icon">💰</div>
          <div class="stat-info">
            <div class="stat-label">Your Balance</div>
            <div class="stat-value" id="dr_balance">₹0.00</div>
          </div>
        </div>
      </div>

      <div class="dice-container">
        <div class="form-group">
          <label>Enter Bet Amount (₹)</label>
          <input type="number" id="dr_bet" value="10" min="10" step="10" class="input-admin" style="text-align:center;font-size:1.2rem;margin-bottom:20px;">
        </div>

        <label>Pick Your Side</label>
        <div class="dice-picks">
          <div class="dice-btn selected" onclick="pickDice(1)">
            <div class="dice-face side-1"><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>
          </div>
          <div class="dice-btn" onclick="pickDice(2)">
            <div class="dice-face side-2"><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>
          </div>
          <div class="dice-btn" onclick="pickDice(3)">
            <div class="dice-face side-3"><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>
          </div>
          <div class="dice-btn" onclick="pickDice(4)">
            <div class="dice-face side-4"><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>
          </div>
          <div class="dice-btn" onclick="pickDice(5)">
            <div class="dice-face side-5"><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>
          </div>
          <div class="dice-btn" onclick="pickDice(6)">
            <div class="dice-face side-6"><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>
          </div>
        </div>
        <input type="hidden" id="dr_pick" value="1">

        <div class="dice" id="d">
          <div class="dice-face large side-1"><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>
        </div>

        <div id="dr_msg" class="success-msg" style="display:none;margin-bottom:15px;"></div>
        
        <button class="btn btn-primary" id="rollBtn" style="width:100%;font-size:1.1rem;padding:15px;" onclick="drPlay()">🎲 Roll the Dice</button>
      </div>

      <div class="rules-card">
        <h4>📜 Dice Royale Rules</h4>
        <ul>
          <li>Set your bet (Minimum ₹10).</li>
          <li>Choose a side from 1 to 6.</li>
          <li>Correct guess pays <strong>5x</strong> your bet!</li>
          <li>Special: Guess <strong>6</strong> correctly for a <strong>6x Payout!</strong></li>
        </ul>
      </div>

      <div style="text-align:center;margin-top:20px;">
        <a href="/games.html" class="btn btn-buy" style="width:auto;">⬅️ Back to Games</a>
      </div>
    </div>
  </div>
  <script src="/js/game-dice.js"></script>
</body>
</html>
